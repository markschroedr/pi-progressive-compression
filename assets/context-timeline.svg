<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc">
  <title id="title">Chronological model context</title>
  <desc id="desc">Model context reads top to bottom, oldest first. Older exchanges appear as numbered summary lines. Recent conversation and tool evidence stay below them, followed by new messages. context_zoom expands a reference to its original text in the archive.</desc>
  <style>
    :root { --g: #57606a; --a: #a35d0b; --txt: #4b535c; }
    @media (prefers-color-scheme: dark) { :root { --g: #8b949e; --a: #d39b52; --txt: #8b949e; } }
    .g { stroke: var(--g); }
    .a { stroke: var(--a); }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--txt); }
    .t { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    .s { font-size: 12px; }
    .tag { font-size: 11.5px; font-weight: 600; }
    .ta { font-size: 11.5px; font-weight: 600; fill: var(--a); }
  </style>

  <!-- headers -->
  <text class="t" x="40" y="22">Model context, top = oldest</text>
  <text class="s" x="300" y="22">context_zoom(#n) expands a reference</text>
  <text class="t" x="546" y="22">Archive</text>

  <!-- time axis -->
  <path class="g" d="M24 34 V298" stroke-width="1.6" stroke-dasharray="1 5"/>
  <path class="g" d="M19 290 L24 298 L29 290" stroke-width="1.6"/>

  <!-- summary lines -->
  <g stroke-width="1.4">
    <rect class="g" x="40" y="34" width="440" height="22" rx="5" opacity=".7"/>
    <rect class="g" x="40" y="62" width="440" height="22" rx="5" opacity=".7"/>
    <rect class="g" x="40" y="90" width="440" height="22" rx="5" opacity=".7"/>
    <rect class="a" x="40" y="118" width="440" height="22" rx="5" stroke-width="1.8"/>
  </g>
  <text class="tag" x="52" y="49">#1</text>
  <text class="s" x="92" y="49">Goal: move settings to TOML</text>
  <text class="tag" x="52" y="77">#4</text>
  <text class="s" x="92" y="77">Parser rewrite rejected; loader kept</text>
  <text class="tag" x="52" y="105">#8</text>
  <text class="s" x="92" y="105">Migration order agreed; old keys readable</text>
  <text class="ta" x="52" y="133">#9</text>
  <text class="s" x="92" y="133">Open: CI cache key not verified</text>

  <!-- boundary: summary above, recent material below -->
  <path class="g" d="M40 156 H480" stroke-width="1.4" stroke-dasharray="4 5" opacity=".6"/>
  <text class="s" x="40" y="172">recent conversation + tool evidence</text>

  <g stroke-width="1.5">
    <rect class="g" x="40" y="182" width="250" height="28" rx="8"/>
    <rect class="g" x="230" y="218" width="250" height="28" rx="8"/>
    <rect class="g" x="40" y="254" width="250" height="26" rx="8" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
  <text class="s" x="52" y="200">user: sample request</text>
  <text class="s" x="242" y="236">assistant: sample reply</text>
  <text class="s" x="52" y="271">tool result: trimmed preview</text>

  <!-- new message -->
  <rect class="a" x="40" y="292" width="440" height="26" rx="6" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text class="s" x="52" y="309">new message: raw until the next refresh</text>

  <!-- zoom to archive -->
  <path class="a" d="M482 129 C 506 129, 510 148, 540 148" stroke-width="1.6" stroke-dasharray="1 5"/>
  <path class="a" d="M533 143 L541 148 L533 153" stroke-width="1.6"/>

  <!-- archive pages -->
  <g stroke-width="1.4">
    <rect class="g" x="566" y="40" width="164" height="118" rx="8" opacity=".35"/>
    <rect class="g" x="556" y="50" width="164" height="118" rx="8" opacity=".6"/>
    <rect class="g" x="546" y="60" width="164" height="118" rx="8" stroke-width="1.8"/>
  </g>
  <g stroke-width="2.6">
    <line class="g" x1="562" y1="84" x2="692" y2="84" opacity=".6"/>
    <line class="g" x1="562" y1="100" x2="668" y2="100" opacity=".6"/>
    <line class="g" x1="562" y1="116" x2="686" y2="116" opacity=".6"/>
    <line class="g" x1="562" y1="132" x2="650" y2="132" opacity=".6"/>
    <line class="a" x1="562" y1="148" x2="690" y2="148" stroke-width="2.6"/>
    <line class="g" x1="562" y1="164" x2="640" y2="164" opacity=".6"/>
  </g>

  <text class="t" x="546" y="204">Originals</text>
  <text class="s" x="546" y="222">Exchanges kept in full.</text>
  <text class="s" x="546" y="238">context_zoom(#n) reads them,</text>
  <text class="s" x="546" y="254">paged on demand.</text>
  <text class="s" x="546" y="270">Earlier line versions kept.</text>

  <!-- footer -->
  <text class="t" x="40" y="338">Summaries are lossy. Originals are recoverable.</text>
</svg>
